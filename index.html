<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insign Tech - Under Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-primary: #06b6d4;
            /* Cyan */
            --accent-secondary: #3b82f6;
            /* Blue */
            --card-bg: rgba(255, 255, 255, 0.8);
            --border-color: rgba(241, 245, 249, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient gradient background glows */
        .glow-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .glow-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.45;
        }

        .glow-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
        }

        .glow-2 {
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
        }

        /* Container & Card */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 3rem 2.5rem;
            max-width: 580px;
            width: 90%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 100px rgba(15, 23, 42, 0.05), 0 2px 10px rgba(15, 23, 42, 0.02);
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-container {
            margin-bottom: 2.5rem;
            display: inline-block;
        }

        .logo {
            max-height: 50px;
            width: auto;
            border-radius: 8px;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo:hover {
            transform: scale(1.05);
        }

        /* Creative Animated Illustration */
        .illustration-container {
            position: relative;
            width: 280px;
            height: 200px;
            margin: 0 auto 2.5rem;
        }

        .scene {
            width: 100%;
            height: 100%;
        }

        /* Floating isometric block styling */
        .iso-block {
            transform-origin: center;
            animation: float 4s ease-in-out infinite;
        }

        .iso-block-shadow {
            transform-origin: center;
            animation: shadowScale 4s ease-in-out infinite;
            opacity: 0.15;
        }

        /* Timing adjustments for different parts */
        .delay-1 {
            animation-delay: -1s;
        }

        .delay-2 {
            animation-delay: -2s;
        }

        .pulse-light {
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        .connector-line {
            stroke-dasharray: 8;
            animation: dash 15s linear infinite;
        }

        /* Text & Headings */
        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            line-height: 1.2;
        }

        h1 span {
            background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.05rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 2.5rem;
            font-weight: 400;
            max-width: 440px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Dynamic Progress Bar */
        .progress-bar-container {
            width: 100%;
            max-width: 320px;
            height: 6px;
            background: #f1f5f9;
            border-radius: 10px;
            margin: 0 auto 2.5rem;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 45%;
            background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
            border-radius: 10px;
            position: absolute;
            left: 0;
            top: 0;
            animation: progressMove 2.5s ease-in-out infinite;
        }

        /* Footer Info */
        .footer {
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
            padding-top: 1.75rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .footer-item svg {
            width: 14px;
            height: 14px;
            fill: #94a3b8;
        }

        /* Keyframes Animations */
        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes shadowScale {

            0%,
            100% {
                transform: scale(1) translateY(0);
                opacity: 0.15;
            }

            50% {
                transform: scale(0.85) translateY(4px);
                opacity: 0.08;
            }
        }

        @keyframes pulseGlow {
            0% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -100;
            }
        }

        @keyframes progressMove {
            0% {
                left: -45%;
            }

            50% {
                left: 100%;
            }

            100% {
                left: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="glow-bg">
        <div class="glow-circle glow-1"></div>
        <div class="glow-circle glow-2"></div>
    </div>

    <div class="container">
        <div class="logo-container">
            <img src="assets/logo.PNG" alt="Insign Tech" class="logo">
        </div>

        <!-- Creative Interactive Isometric Maintenance Illustration -->
        <div class="illustration-container">
            <svg class="scene" viewBox="0 0 300 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Base Grid Lines -->
                <path d="M50 150 L150 200 L250 150 M150 200 L150 120" stroke="#e2e8f0" stroke-width="1.5"
                    stroke-linecap="round" />

                <!-- Connection lines pulsing -->
                <path class="connector-line" d="M90 130 L150 160 L210 130" stroke="url(#lineGradient)"
                    stroke-width="1.5" stroke-linecap="round" />

                <!-- Floating Base Shadow -->
                <ellipse class="iso-block-shadow" cx="150" cy="180" rx="40" ry="12" fill="#3b82f6" />

                <!-- Left floating block -->
                <g class="iso-block delay-1">
                    <!-- Front Left Face -->
                    <path d="M60 110 L95 128 L95 148 L60 130 Z" fill="#60a5fa" opacity="0.85" />
                    <!-- Front Right Face -->
                    <path d="M95 128 L130 110 L130 130 L95 148 Z" fill="#2563eb" />
                    <!-- Top Face -->
                    <path d="M60 110 L95 92 L130 110 L95 128 Z" fill="#93c5fd" />
                </g>

                <!-- Right floating block -->
                <g class="iso-block delay-2">
                    <!-- Front Left Face -->
                    <path d="M170 110 L205 128 L205 148 L170 130 Z" fill="#22d3ee" opacity="0.85" />
                    <!-- Front Right Face -->
                    <path d="M205 128 L240 110 L240 130 L205 148 Z" fill="#0891b2" />
                    <!-- Top Face -->
                    <path d="M170 110 L205 92 L240 110 L205 128 Z" fill="#67e8f9" />
                </g>

                <!-- Center Floating Core Cube -->
                <g class="iso-block">
                    <!-- Front Left Face -->
                    <path d="M115 70 L150 88 L150 118 L115 100 Z" fill="url(#cyanGrad)" />
                    <!-- Front Right Face -->
                    <path d="M150 88 L185 70 L185 100 L150 118 Z" fill="url(#blueGrad)" />
                    <!-- Top Face -->
                    <path d="M115 70 L150 52 L185 70 L150 88 Z" fill="#a5f3fc" />
                    <!-- Glowing Core Indicator -->
                    <circle class="pulse-light" cx="150" cy="70" r="5" fill="#ffffff"
                        filter="drop-shadow(0 0 6px #06b6d4)" />
                </g>

                <!-- Small floaters -->
                <g class="iso-block delay-1">
                    <circle cx="95" cy="65" r="3" fill="#3b82f6" />
                    <path d="M95 65 L95 80" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2 2" />
                </g>
                <g class="iso-block delay-2">
                    <circle cx="205" cy="65" r="3" fill="#06b6d4" />
                    <path d="M205 65 L205 80" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 2" />
                </g>

                <!-- Gradients -->
                <defs>
                    <linearGradient id="cyanGrad" x1="115" y1="70" x2="150" y2="118" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#06b6d4" />
                        <stop offset="100%" stop-color="#0891b2" />
                    </linearGradient>
                    <linearGradient id="blueGrad" x1="150" y1="88" x2="185" y2="100" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#3b82f6" />
                        <stop offset="100%" stop-color="#1d4ed8" />
                    </linearGradient>
                    <linearGradient id="lineGradient" x1="90" y1="130" x2="210" y2="130" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
                        <stop offset="50%" stop-color="#06b6d4" />
                        <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <h1>Under <span>Maintenance</span></h1>
        <p>We are currently upgrading and fine-tuning our digital core to provide you with a more powerful and seamless
            experience.</p>

        <!-- Animated Progress Indicator -->
        <div class="progress-bar-container">
            <div class="progress-bar"></div>
        </div>

        <div class="footer">
            <div class="footer-item">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
                </svg>
                <span>info@insign.in</span>
            </div>
            <div>&copy; 2026 Insign Tech.</div>
        </div>
    </div>
</body>

</html>
